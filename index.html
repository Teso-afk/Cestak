<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cesťák</title>
<meta name="theme-color" content="#1d3f8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cesťák">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:"Caveat";src:url(fonts/Caveat.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:"Oooh Baby";src:url(fonts/OoohBaby.woff2) format("woff2")}
@font-face{font-family:"Bad Script";src:url(fonts/BadScript.woff2) format("woff2")}
@font-face{font-family:"Dancing Script";src:url(fonts/DancingScript.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:"Comforter";src:url(fonts/Comforter.woff2) format("woff2")}
@font-face{font-family:"Kalam";src:url(fonts/Kalam.woff2) format("woff2")}
:root{
  --bg:#f3f4f7;--card:#fff;--text:#16181d;--muted:#6b7280;--line:#e3e5ea;
  --accent:#1d3f8f;--accent-weak:#e6ecfa;--danger:#c0392b;--ok:#1e7d4f;--ink:#1b2a8a;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#1a1d23;--text:#eceef2;--muted:#9aa1ad;--line:#2a2e36;
  --accent:#7ea2ff;--accent-weak:#1f2a44;--danger:#ff7b6b;--ok:#5fd39a;--ink:#9db4ff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;gap:8px}
header.top h1{font-size:22px;margin:0;flex:1}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav button{border:0;background:var(--card);color:var(--text);width:36px;height:36px;border-radius:10px;font-size:18px}
.monthnav span{min-width:120px;text-align:center;font-weight:600}
main{padding:0 16px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.banner{background:var(--accent-weak);border-radius:14px;padding:12px 14px;margin:10px 0;display:flex;gap:10px;align-items:center}
.banner p{margin:0;flex:1}
.trip{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.trip .d{min-width:54px;text-align:center;background:var(--accent-weak);border-radius:10px;padding:6px 4px;font-weight:700;color:var(--accent)}
.trip .d small{display:block;font-weight:500;font-size:12px}
.trip .b{flex:1;min-width:0}
.trip .b b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip .b div{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.count{color:var(--muted);font-size:14px;margin:4px 2px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:8px 0 10px;font-size:12px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button i{display:block;font-style:normal;font-size:22px;line-height:1.2}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:29px;border:0;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:9}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;background:var(--accent);color:#fff;text-decoration:none}
.btn.sec{background:var(--accent-weak);color:var(--accent)}
.btn.danger{background:none;color:var(--danger)}
.btn.block{width:100%;margin-top:10px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));display:none}
.sheet.open{display:block}
.sheet header{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:2}
.sheet header h2{flex:1;margin:0;font-size:19px}
.sheet header button{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;font-size:17px;padding:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:6px 2px}
.preview{width:100%;border-radius:8px;border:1px solid var(--line);background:#fff;display:block}
.fontpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fontpick button{border:2px solid var(--line);background:#fff;color:#1b2a8a;border-radius:12px;padding:8px;font-size:24px;min-height:56px}
.fontpick button.on{border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.sep{height:1px;background:var(--line);margin:14px 0}
h3{margin:4px 0 6px;font-size:16px}
.tpl{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.tpl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpl button{border:0;background:none;color:var(--danger);font-size:18px}
.switch{display:flex;align-items:center;gap:10px;margin-top:12px}
.switch input{width:auto}
</style>
</head>
<body>
<header class="top">
  <h1>Cesťák</h1>
  <div class="monthnav"><button id="mPrev" aria-label="Předchozí měsíc">‹</button><span id="mLabel"></span><button id="mNext" aria-label="Další měsíc">›</button></div>
</header>

<main>
  <section id="tab-list"></section>
  <section id="tab-form" hidden></section>
  <section id="tab-settings" hidden></section>
</main>

<button class="fab" id="fab" aria-label="Přidat cestu">+</button>

<nav class="tabs">
  <button data-tab="list" class="on"><i>☰</i>Cesty</button>
  <button data-tab="form"><i>🖨</i>Formulář</button>
  <button data-tab="settings"><i>⚙︎</i>Nastavení</button>
</nav>

<div class="sheet" id="editSheet"></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
